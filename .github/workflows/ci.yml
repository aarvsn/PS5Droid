name: ci

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: format & repo hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==23.1.3

      - name: clang-format check
        run: |
          find src tests -name '*.cpp' -o -name '*.h' | sort | \
            xargs clang-format --dry-run --Werror

      - name: Repository hygiene
        run: |
          set -e
          for f in README.md LICENSE THIRD_PARTY_NOTICES.md CMakeLists.txt \
                   CHANGELOG.md \
                   docs/architecture.md docs/platform-constraints.md \
                   docs/waydroid-analysis.md docs/development.md \
                   .clang-format .gitignore; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          ! grep -RInE 'fake (SDK|implementation)|return success; *// *placeholder|TODO: pretend' src tests

  host:
    name: host build & tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_COMPILER=clang
          else
            cmake -B build -G Ninja
          fi

      - name: Build
        run: cmake --build build 2>&1 | tee build.log

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      - name: Runtime smoke test (host binary is NOT a PS5 executable)
        run: |
          ./build/ps5droid-host | tee smoke.log
          ./build/ps5droid-host --matrix | tee matrix.log
          ./build/ps5droid-host --start-attempt | tee start.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.compiler }}-logs
          path: |
            build.log
            test.log
            smoke.log
            matrix.log
            start.log

  ps5:
    name: PS5 payload cross-build (ELF only)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18-dev cmake ninja-build wget unzip

      - name: Install ps5-payload-sdk (open-source release)
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -d /opt ps5-payload-sdk.zip
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Configure (ps5-payload-sdk toolchain)
        shell: bash
        run: |
          set -euo pipefail

          # The release zip flattens host/ into the SDK root; source
          # checkouts keep the toolchain under host/toolchain/.
          TOOLCHAIN=""
          for candidate in \
              "$PS5_PAYLOAD_SDK/toolchain/prospero.cmake" \
              "$PS5_PAYLOAD_SDK/host/toolchain/prospero.cmake"; do
            if [ -f "$candidate" ]; then
              TOOLCHAIN="$candidate"
              break
            fi
          done

          if [ -z "$TOOLCHAIN" ]; then
            echo "::error::PS5 toolchain file not found"
            find "$PS5_PAYLOAD_SDK" -maxdepth 5 -type f \
              -name '*.cmake' -print
            exit 1
          fi
          echo "Using toolchain: $TOOLCHAIN"

          cmake -S . -B build-ps5 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DPS5DROID_BUILD_PS5=ON \
            2>&1 | tee configure-ps5.log

      - name: Build ps5droid.elf
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build-ps5 --target ps5droid \
            2>&1 | tee build-ps5.log

          test -f build-ps5/ps5droid.elf || {
            echo "::error::Expected PS5 ELF was not produced"
            find build-ps5 -maxdepth 4 -type f -print
            exit 1
          }

      - name: Upload payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ps5droid-elf-payload
          path: build-ps5/ps5droid.elf
          if-no-files-found: error

      - name: Artifact note
        run: |
          echo "ps5droid.elf is a native ELF payload for use with an ELF" \
               "loader (e.g. ps5-payload-elfldr). It is NOT a PS5 PKG and" \
               "has not been executed on a console by CI."
